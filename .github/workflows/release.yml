name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must use vMAJOR.MINOR.PATCH format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/AppInfo.plist)"
          if [[ "$bundle_version" != "$version" ]]; then
            echo "tag version $version does not match bundle version $bundle_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_name=HearthstonePuller-${version}-macOS.zip" >> "$GITHUB_OUTPUT"

      - name: Build and verify app
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/verify-release.sh

      - name: Create archive and checksum
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            build/HearthstonePuller.app \
            "dist/$ASSET_NAME"
          (
            cd dist
            shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.release.outputs.version }}
          asset_name: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$asset_name" \
            "dist/$asset_name.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "HearthstonePuller $version"
